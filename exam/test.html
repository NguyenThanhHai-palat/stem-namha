<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Test Login</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
    }
    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 250px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
    .box {
      border: 1px solid #444;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>TEST NAMHACLUB</h1>

<div class="box">
  <h2>Đăng ký</h2>
  <input id="r_name" placeholder="Tên">
  <input id="r_class" placeholder="Lớp">
  <input id="r_yearstudy" placeholder="Năm học">
  <input id="r_email" placeholder="Email">
  <input id="r_password" type="password" placeholder="Password">
  <button onclick="register()">Đăng ký</button>
</div>

<div class="box">
  <h2>Đăng nhập</h2>
  <input id="l_email" placeholder="Email">
  <input id="l_password" type="password" placeholder="Password">
  <button onclick="login()">Đăng nhập</button>
</div>

<div class="box">
  <h2>Thông tin user</h2>
  <button onclick="getUser()">Lấy thông tin</button>
  <pre id="output"></pre>
</div>

<script>
const API = "https://dnc-svc.palat.io.vn/service/2/namhaclub";

async function register() {
  const data = {
    name: document.getElementById("r_name").value,
    classes: document.getElementById("r_class").value,
    yearstudy: document.getElementById("r_yearstudy").value,
    email: document.getElementById("r_email").value,
    password: document.getElementById("r_password").value
  };

  const res = await fetch(API + "/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();
  alert(JSON.stringify(result));
}

async function login() {
  const data = {
    email: document.getElementById("l_email").value,
    password: document.getElementById("l_password").value
  };

  const res = await fetch(API + "/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (result.token) {
    localStorage.setItem("token", result.token);
    alert("Login thành công!");
  } else {
    alert(JSON.stringify(result));
  }
}

async function getUser() {
  const token = localStorage.getItem("token");

  const res = await fetch(API, {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const result = await res.json();
  document.getElementById("output").innerText = JSON.stringify(result, null, 2);
}
</script>

</body>
</html>
