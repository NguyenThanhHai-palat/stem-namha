<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Kết Quả Trúng Tuyển</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary-color: #334155;
            --accent-color: #0ea5e9;
            --border-color: #cbd5e1;
            --text-color: #1e293b;
            --text-light: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 30px;
            border: 1px solid rgba(203, 213, 225, 0.5);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 24px;
            font-size: 24px;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: var(--primary-color);
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            background-color: #f8fafc;
            color: var(--text-color);
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
            background-color: #fff;
        }

        .result-container {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: none; /* Ẩn đi khi chưa có dữ liệu */
            animation: fadeIn 0.4s ease-in-out;
        }

        .result-container.active {
            display: block;
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .label-name {
            color: var(--text-light);
            font-weight: 500;
        }

        .value-name {
            font-weight: 600;
            color: var(--text-color);
            text-align: right;
        }

        .loading {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            display: none;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tra Cứu Kết Quả Trúng Tuyển</h2>
        
    

        <div>Tạm đóng trang tra cứu vì lí do bảo mật</div>

    </div>

</body>
</html>
